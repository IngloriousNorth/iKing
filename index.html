function getHexagramDetails(num) {
    return HEXAGRAM_DATA[num];
}

function numberToLeggeToss(num) {
    if (num <= 31) return 6;    // 1/8 chance (3 Tails -> Old Yin)
    if (num <= 127) return 7;   // 3/8 chance (2 Tails, 1 Head -> Young Yang)
    if (num <= 223) return 8;   // 3/8 chance (1 Tail, 2 Heads -> Young Yin)
    return 9;                   // 1/8 chance (3 Heads -> Old Yang)
}

async function fetchQuantumNumbers() {
    const response = await fetch(PROXY_URL);
    if (!response.ok) throw new Error("Quantum API network error");
    const json = await response.json();
    
    // Expecting an array under json.data, json.numbers, or root array
    const numbers = json.data || json.numbers || json;
    
    if (!Array.isArray(numbers) || numbers.length < 6) {
        throw new Error("Invalid array payload returned from API");
    }
    return numbers.map(Number);
}

async function performDivination() {
    const statusEl = document.getElementById('status');
    const castBtn = document.getElementById('castBtn');
    castBtn.disabled = true;

    const tosses = [];
    const quantumValues = [];

    try {
        statusEl.innerText = "Consulting Quantum Oracle for 6 lines...";
        
        let fetchedNumbers;
        try {
            fetchedNumbers = await fetchQuantumNumbers();
        } catch (err) {
            // Fallback: Generate 6 cryptographically secure random values locally
            const randArr = new Uint8Array(6);
            window.crypto.getRandomValues(randArr);
            fetchedNumbers = Array.from(randArr);
        }

        // Sequentially accumulate lines 1-6 using the pre-fetched numbers
        for (let line = 1; line <= 6; line++) {
            statusEl.innerText = `Casting Line ${line} of 6...`;
            
            const num = fetchedNumbers[line - 1];
            const toss = numberToLeggeToss(num);
            
            tosses.push(toss);
            quantumValues.push(num);
            
            // Brief pause so the UI step-by-step casting accumulation is visible
            await new Promise(resolve => setTimeout(resolve, 150));
        }

        statusEl.innerText = "Processing Quantum State...";
        runDivination(tosses, quantumValues);

    } catch (error) {
        statusEl.innerText = "Error reading quantum entropy. Try again.";
        castBtn.disabled = false;
    }
}
    

function renderVisualHexagram(lines, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    lines.forEach((line) => {
        const row = document.createElement('div');
        row.className = `line-row ${line.isChanging ? 'changing' : ''}`;
        if (line.value === 1) {
            row.innerHTML = `<div class="line-solid"></div>`;
        } else {
            row.innerHTML = `<div class="line-broken"><span></span><span></span></div>`;
        }
        container.appendChild(row);
    });
}

function renderLinesList(hexData, changingLineNumbers, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (let i = 1; i <= 6; i++) {
        const isChanging = changingLineNumbers.includes(i);
        const lineItem = document.createElement('div');
        lineItem.className = `line-item ${isChanging ? 'is-changing-line' : ''}`;
        
        const lineText = hexData.lines[i] || `Line ${i} text unavailable`;
        const changingTag = isChanging ? ` <span style="color: var(--accent-dark); font-weight: bold;">(Changing Line)</span>` : '';

        lineItem.innerHTML = `<span class="line-badge">Line ${i}:</span> "${lineText}"${changingTag}`;
        container.appendChild(lineItem);
    }
}

function runDivination(tosses, quantumValues) {
    const primaryLines = [];
    const transformedLines = [];
    const changingLineNumbers = [];

    tosses.forEach((toss, idx) => {
        const lineNum = idx + 1;
        const isPrimaryYang = (toss === 7 || toss === 9) ? 1 : 0;
        const isChanging = (toss === 6 || toss === 9);
        let isTransformedYang = isPrimaryYang;

        if (isChanging) {
            isTransformedYang = isPrimaryYang === 1 ? 0 : 1;
            changingLineNumbers.push(lineNum);
        }

        primaryLines.push({ value: isPrimaryYang, isChanging, toss });
        transformedLines.push({ value: isTransformedYang, isChanging });
    });

    const pBin = primaryLines.map(l => l.value).join('');
    const sBin = transformedLines.map(l => l.value).join('');

    const pNum = KING_WEN_LOOKUP[pBin] || 1;
    const sNum = KING_WEN_LOOKUP[sBin] || 1;

    const pTrigramTitle = getTrigramTitle(pBin);
    const sTrigramTitle = getTrigramTitle(sBin);

    const pData = getHexagramDetails(pNum);
    const sData = getHexagramDetails(sNum);

    // Visual Hexagram Header Rendering
    renderVisualHexagram(primaryLines, 'pVisual');
    document.getElementById('pTitle').innerText = `Hexagram ${pNum}: ${pData.name}`;
    document.getElementById('pKeywords').innerText = `${pData.title}\n[${pTrigramTitle}]`;

    // 1) Crowley's Original Judgment
    document.getElementById('pOriginalJudgment').innerText = `"${pData.judgment}"`;

    // 2) All lines of Crowley Primary Trans. with changing lines highlighted
    renderLinesList(pData, changingLineNumbers, 'pLinesList');

    const transformedSectionContainer = document.getElementById('transformedSectionContainer');
    const sBox = document.getElementById('sBox');

    if (changingLineNumbers.length > 0) {
        // Render Transformed Hexagram visually in header
        renderVisualHexagram(transformedLines, 'sVisual');
        document.getElementById('sTitle').innerText = `Transformed: ${sNum} (${sData.name})`;
        document.getElementById('sKeywords').innerText = `${sData.title}\n[${sTrigramTitle}]`;
        sBox.style.display = 'block';

        // 3) Crowley Transformed Judgment
        document.getElementById('sOriginalJudgment').innerText = `"${sData.judgment}"`;

        // 4) All lines of transformed hexagram Crowley translation with changing lines highlighted
        renderLinesList(sData, changingLineNumbers, 'sLinesList');

        transformedSectionContainer.style.display = 'block';
    } else {
        sBox.style.display = 'none';
        transformedSectionContainer.style.display = 'none';
    }

    const metaText = `Quantum Numbers (Lines 1-6): [${quantumValues.join(', ')}]<br>Coin Toss Values: [${tosses.join(', ')}]`;
    document.getElementById('drandMeta').innerHTML = `<b>Entropy Source:</b><br>${metaText}`;

    document.getElementById('result').style.display = 'block';
    document.getElementById('status').innerText = "";
    document.getElementById('castBtn').disabled = false;
}

document.getElementById('castBtn').addEventListener('click', performDivination);
</script>

</body>
</html>
